[package]
name = "bevy_cube_viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { path = "../../bevy", features = ["default", "experimental_bevy_ui_widgets"] }
bevy_dev_tools = { path = "../../bevy/crates/bevy_dev_tools" }
bytemuck = "1.5"
rand = "0.8"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
